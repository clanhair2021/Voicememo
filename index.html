<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家族の音声メモ（リアルタイム共有版）</title>
  <link rel="manifest" href="manifest.json">
  <!-- Supabase JS ライブラリの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 全体のレイアウト設定 */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 15px 15px 90px 15px; 
      background-color: #f7f4ef; 
      color: #4a4238; 
    }
    h1 { 
      text-align: center; 
      color: #5c4e3e; 
      font-size: 20px; 
      margin-bottom: 12px;
    }

    /* カテゴリ切り替えタブ */
    .tabs-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-container::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      white-space: nowrap;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 20px;
      border: 1px solid #dcd4c7;
      background-color: #ffffff;
      color: #6e5e49;
      cursor: pointer;
      font-weight: normal;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background-color: #8c7355;
      color: #ffffff;
      border-color: #8c7355;
      font-weight: bold;
    }

    /* 検索バー */
    .search-box {
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #dcd4c7;
      border-radius: 10px;
      outline: none;
      background-color: #ffffff;
      color: #4a4238;
      box-sizing: border-box;
    }
    
    /* 入力エリアを画面下に固定 */
    .input-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f7f4ef;
      padding: 12px 15px;
      box-sizing: border-box;
      box-shadow: 0 -4px 10px rgba(92, 78, 62, 0.08);
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .input-box { 
      display: flex; 
      gap: 8px; 
      width: 100%;
      max-width: 470px;
    }
    input[type="text"] { 
      flex: 1; 
      padding: 12px 14px; 
      font-size: 16px; 
      border: 1px solid #dcd4c7; 
      border-radius: 10px; 
      outline: none; 
      background-color: #ffffff;
      color: #4a4238;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
      transition: border-color 0.2s;
    }
    input[type="text"].listening {
      border-color: #e07a5f;
      background-color: #fffaf8;
    }
    input[type="text"]::placeholder, .search-input::placeholder {
      color: #a39889;
    }
    button { 
      padding: 12px 16px; 
      font-size: 16px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-send { 
      background: #8c7355; 
      color: white; 
    }
    .btn-mic { 
      background: #e07a5f; 
      color: white; 
    }
    .btn-mic.active {
      background: #d14928;
      box-shadow: 0 0 8px rgba(224, 122, 95, 0.6);
    }
    
    /* メモカードのスタイル */
    .card { 
      background: #ffffff; 
      padding: 14px 16px; 
      border-radius: 12px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 8px rgba(92, 78, 62, 0.06); 
      border: 1px solid #efe9df;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px;
    }
    .card.pinned {
      background: #fffdf5;
      border: 1.5px solid #e8c872;
      box-shadow: 0 3px 10px rgba(232, 200, 114, 0.2);
    }
    .card.completed {
      background-color: #faf7f2;
      opacity: 0.7;
    }
    .card.completed .card-text {
      text-decoration: line-through;
      color: #a39889;
    }

    .card-content-area {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
    }
    .card-checkbox {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #8c7355;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-text { 
      font-size: 16px; 
      color: #4a4238; 
      word-break: break-all; 
      line-height: 1.4;
    }
    .card-edit-input {
      font-size: 16px;
      padding: 4px 8px;
      border: 1px solid #8c7355;
      border-radius: 6px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
    }
    .card-date {
      font-size: 11px;
      color: #a39889;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-action {
      background: #f0eae1;
      color: #8c7355;
      font-size: 13px;
      padding: 6px 9px;
      border-radius: 8px;
    }
    .btn-action.active {
      background: #fce8b2;
      color: #8a6400;
    }
    .btn-del { 
      background: #f5e6e1; 
      color: #c05638; 
      font-size: 12px; 
      padding: 6px 9px; 
      border-radius: 8px; 
    }
    .section-title {
      font-size: 14px;
      color: #6e5e49;
      margin: 20px 0 8px 4px;
      font-weight: bold;
      border-bottom: 1px solid #dcd4c7;
      padding-bottom: 4px;
    }
    #status { 
      text-align: center; 
      color: #8c8070; 
      margin-top: 24px; 
      font-size: 14px; 
    }
  </style>
</head>
<body>

  <h1>🎤 家族の音声メモ</h1>

  <!-- カテゴリ切り替えタブ -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="selectTab('all')">すべて</button>
    <button class="tab-btn" onclick="selectTab('📅 予約')">📅 予約</button>
    <button class="tab-btn" onclick="selectTab('🛒 買い物')">🛒 買い物</button>
    <button class="tab-btn" onclick="selectTab('📅 予定')">📅 予定</button>
    <button class="tab-btn" onclick="selectTab('📋 タスク')">📋 タスク</button>
    <button class="tab-btn" onclick="selectTab('📝 その他')">📝 その他</button>
  </div>

  <!-- 検索バー -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 メモを検索...">
  </div>

  <div id="notesList"></div>
  <div id="status">同期中...</div>

  <!-- 画面下に固定する入力バー -->
  <div class="input-container">
    <div class="input-box">
      <input type="text" id="noteInput" placeholder="例: 病院 明日の10時">
      <button class="btn-mic" id="micBtn">🎤</button>
      <button class="btn-send" id="sendBtn">送信</button>
    </div>
  </div>

  <script>
    // Supabaseの初期化設定
    const SUPABASE_URL = 'https://lmprkzdgeyijjmzuptom.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtcHJremRnZXlpamptenVwdG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTk1NjgsImV4cCI6MjEwMDczNTU2OH0.W3tNVAHXlwdNS8LUB5WLKOv4cU8BBHF0VAvGSz9QsP0';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'all';
    let allNotes = []; // メモリ上の全メモデータ
    let editingNoteId = null; // 編集中のメモID

    // 初期化とリアルタイム監視の開始
    async function init() {
      await fetchNotes();
      subscribeToRealtime();
    }

    // Supabaseからのデータ読み込み
    async function fetchNotes() {
      const { data, error } = await db.from('notes').select('*').order('id', { ascending: false });
      if (error) {
        console.error('取得エラー:', error);
        document.getElementById('status').innerText = 'データの取得に失敗しました';
        return;
      }
      allNotes = data || [];
      renderNotes();
    }

    // Supabaseのリアルタイム変更を検知（他端末で変化があったときに自動更新）
    function subscribeToRealtime() {
      db.channel('public:notes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, () => {
          fetchNotes();
        })
        .subscribe();
    }

    function selectTab(category) {
      currentTab = category;
      
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => {
        if ((category === 'all' && btn.innerText === 'すべて') || btn.innerText === category) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderNotes();
    }

    // 画面への描画処理
    function renderNotes() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('notesList');
      const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      listEl.innerHTML = '';

      let notes = [...allNotes];

      if (searchQuery) {
        notes = notes.filter(note => note.content.toLowerCase().includes(searchQuery));
      }

      if (currentTab !== 'all') {
        notes = notes.filter(note => (note.category || '📝 その他') === currentTab);
      }

      if (notes.length === 0) {
        statusEl.innerText = searchQuery ? '該当するメモが見つかりません' : 'メモはありません';
        return;
      }
      statusEl.innerText = '';

      const pinnedNotes = notes.filter(n => n.pinned);
      if (pinnedNotes.length > 0) {
        appendSection(listEl, '📌 ピックアップ', pinnedNotes);
      }

      if (currentTab === 'all') {
        const categories = ['📅 予約', '🛒 買い物', '📅 予定', '📋 タスク', '📝 その他'];
        categories.forEach(category => {
          const catNotes = notes.filter(n => !n.pinned && (n.category || '📝 その他') === category);
          if (catNotes.length > 0) {
            appendSection(listEl, category, catNotes);
          }
        });
      } else {
        const unpinnedNotes = notes.filter(n => !n.pinned);
        if (unpinnedNotes.length > 0) {
          appendSection(listEl, currentTab, unpinnedNotes);
        }
      }
    }

    function appendSection(container, titleText, notesArray) {
      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerText = titleText;
      container.appendChild(title);

      notesArray.forEach(note => {
        const isEditing = (editingNoteId === note.id);
        const div = document.createElement('div');
        div.className = `card ${note.pinned ? 'pinned' : ''} ${note.completed ? 'completed' : ''}`;
        
        let contentHtml = '';
        if (isEditing) {
          contentHtml = `<input type="text" class="card-edit-input" id="edit-input-${note.id}" value="${escapeHtml(note.content)}">`;
        } else {
          contentHtml = `<span class="card-text">${escapeHtml(note.content)}</span>`;
        }

        div.innerHTML = `
          <div class="card-content-area">
            <input type="checkbox" class="card-checkbox" ${note.completed ? 'checked' : ''} onclick="toggleComplete(${note.id}, ${!note.completed})">
            <div class="card-body">
              ${contentHtml}
              <span class="card-date">${note.created_at || ''}</span>
            </div>
          </div>
          <div class="card-actions">
            ${isEditing ? 
              `<button class="btn-action" onclick="saveEdit(${note.id})">保存</button>` :
              `<button class="btn-action" onclick="startEdit(${note.id})">✏️</button>`
            }
            <button class="btn-action ${note.pinned ? 'active' : ''}" onclick="togglePin(${note.id}, ${!note.pinned})">📌</button>
            <button class="btn-del" onclick="deleteNote(${note.id})">削除</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // メモ追加
    async function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      let category = '📝 その他';
      if (text.includes('予約') || text.includes('事前予約') || text.includes('お店') || text.includes('店')) {
        category = '📅 予約';
      } else if (text.includes('買い物') || text.includes('買いたい') || text.includes('買って')) {
        category = '🛒 買い物';
      } else if (text.includes('予定') || text.includes('明日') || text.includes('来週') || text.includes('日') || text.includes('病院') || text.includes('子供')) {
        category = '📅 予定';
      } else if (text.includes('タスク') || text.includes('やること') || text.includes('掃除')) {
        category = '📋 タスク';
      }

      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newNote = {
        id: Date.now(),
        content: text,
        category: category,
        pinned: false,
        completed: false,
        created_at: dateStr
      };

      input.value = '';

      const { error } = await db.from('notes').insert([newNote]);
      if (error) {
        console.error('追加エラー:', error);
        alert('メモの保存に失敗しました');
      } else {
        selectTab(category);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 完了チェック切り替え
    async function toggleComplete(id, completed) {
      await db.from('notes').update({ completed: completed }).eq('id', id);
    }

    // ピン留め切り替え
    async function togglePin(id, pinned) {
      await db.from('notes').update({ pinned: pinned }).eq('id', id);
    }

    // メモ削除
    async function deleteNote(id) {
      await db.from('notes').delete().eq('id', id);
    }

    // 編集モード開始
    function startEdit(id) {
      editingNoteId = id;
      renderNotes();
      
      setTimeout(() => {
        const input = document.getElementById(`edit-input-${id}`);
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit(id);
          });
        }
      }, 50);
    }

    // 編集保存
    async function saveEdit(id) {
      const input = document.getElementById(`edit-input-${id}`);
      if (!input) return;
      const newText = input.value.trim();
      if (!newText) return;

      let category = '📝 その他';
      if (newText.includes('予約') || newText.includes('事前予約') || newText.includes('お店') || newText.includes('店')) {
        category = '📅 予約';
      } else if (newText.includes('買い物') || newText.includes('買いたい') || newText.includes('買って')) {
        category = '🛒 買い物';
      } else if (newText.includes('予定') || newText.includes('明日') || newText.includes('来週') || newText.includes('日') || newText.includes('病院') || newText.includes('子供')) {
        category = '📅 予定';
      } else if (newText.includes('タスク') || newText.includes('やること') || newText.includes('掃除')) {
        category = '📋 タスク';
      }

      editingNoteId = null;
      await db.from('notes').update({ content: newText, category: category }).eq('id', id);
    }

    // 音声入力処理
    let recognition = null;

    function startSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声入力に対応していません');
        return;
      }

      const inputEl = document.getElementById('noteInput');
      const micBtn = document.getElementById('micBtn');

      if (recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = true;
      recognition.continuous = false;

      let baseText = inputEl.value;

      recognition.onstart = () => {
        micBtn.classList.add('active');
        inputEl.classList.add('listening');
        inputEl.placeholder = '🎤 話してください...';
      };

      recognition.onresult = (e) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = e.resultIndex; i < e.results.length; i++) {
          const transcript = e.results[i][0].transcript;
          if (e.results[i].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        const currentText = finalTranscript || interimTranscript;
        inputEl.value = baseText ? baseText + ' ' + currentText : currentText;
      };

      recognition.onerror = (e) => {
        console.error('音声認識エラー:', e.error);
        stopMicUI();
      };

      recognition.onend = () => {
        stopMicUI();
      };

      function stopMicUI() {
        micBtn.classList.remove('active');
        inputEl.classList.remove('listening');
        inputEl.placeholder = '例: 病院 明日の10時';
        recognition = null;
      }

      recognition.start();
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
    }

    document.getElementById('sendBtn').addEventListener('click', addNote);
    document.getElementById('micBtn').addEventListener('click', startSpeech);
    document.getElementById('noteInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addNote();
    });
    
    document.getElementById('searchInput').addEventListener('input', renderNotes);

    // アプリ起動
    init();
  </script>
</body>
</html>
