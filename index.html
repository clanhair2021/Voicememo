<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>家族の音声メモ</title>

  <!-- PWA・全画面表示のための超重要設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="音声メモ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f59e0b">

  <!-- iPhone用ホーム画面アイコン（これがないと全画面化を拒否されます） -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/25/25682.png">

  <!-- デザイン用 (Tailwind CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase（データベース用） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50/50 p-4 pb-40 max-w-md mx-auto min-h-screen text-gray-800 pt-8">

  <!-- ヘッダー -->
  <header class="mb-4 text-center">
    <h1 class="text-2xl font-bold text-amber-900">🗣️ 家族の音声メモ</h1>
    <p class="text-xs text-amber-700 mt-1">声で残して、みんなで共有しよう</p>
  </header>

  <!-- 検索窓 -->
  <div class="mb-3">
    <input type="text" id="searchInput" placeholder="🔍 メモを検索..." oninput="fetchNotes()" class="w-full text-xs p-2 bg-white border border-amber-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400">
  </div>

  <!-- 名前入力 -->
  <div class="mb-4 bg-white p-3 rounded-xl shadow-sm border border-amber-100">
    <label class="text-xs text-amber-800 font-bold block mb-1">あなたの名前</label>
    <input type="text" id="userName" placeholder="例: たろう" class="w-full text-sm p-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400">
  </div>

  <!-- メモ一覧表示エリア -->
  <div id="notesList" class="space-y-3">
    <p class="text-center text-amber-700/60 py-8">読み込み中...</p>
  </div>

  <!-- 固定フッター（音声入力＆投稿） -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-amber-100 pb-8">
    <div class="max-w-md mx-auto space-y-2">
      <div class="flex gap-2">
        <textarea id="memoInput" placeholder="🎤 マイクを押して話してみてね..." class="flex-1 text-sm p-2.5 border border-gray-200 rounded-xl resize-none h-12 focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
        <button id="micBtn" onclick="toggleListening()" class="px-4 rounded-xl font-bold bg-amber-100 text-amber-800 hover:bg-amber-200 transition-all flex items-center justify-center shrink-0">
          🎤 マイク
        </button>
      </div>
      <button onclick="saveNote()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition-colors shadow-sm">
        メモを追加する
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dpvsqapxwiemqnroxddc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Rtje4WV6j9zedHnWR3jhyQ_y5su2bee';

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error('Supabase初期化失敗:', e);
    }

    let recognition = null;
    let isListening = false;

    window.onload = () => {
      const savedName = localStorage.getItem('family_user_name');
      if (savedName) document.getElementById('userName').value = savedName;
      
      if (supabaseClient) {
        fetchNotes();
        try {
          supabaseClient.channel('public:notes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, fetchNotes)
            .subscribe();
        } catch (err) {
          console.error('リアルタイム設定エラー:', err);
        }
      } else {
        document.getElementById('notesList').innerHTML = '<p class="text-center text-amber-700/60 py-8">まだメモはありません</p>';
      }
    };

    async function fetchNotes() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from('notes').select('*').order('created_at', { ascending: false });
      const listEl = document.getElementById('notesList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      if (error) {
        console.error('取得エラー:', error);
        listEl.innerHTML = '<p class="text-center text-red-500 py-8">データの読み込みに失敗しました</p>';
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = '<p class="text-center text-amber-700/60 py-8">まだメモはありません</p>';
        return;
      }

      const filteredData = data.filter(note => {
        const content = note.content ? note.content.toLowerCase() : '';
        const userName = note.user_name ? note.user_name.toLowerCase() : '';
        return content.includes(searchQuery) || userName.includes(searchQuery);
      });

      if (filteredData.length === 0) {
        listEl.innerHTML = '<p class="text-center text-amber-700/60 py-8">一致するメモが見つかりません</p>';
        return;
      }

      listEl.innerHTML = filteredData.map(note => {
        const isCompleted = note.is_completed;
        const contentStyle = isCompleted ? 'line-through text-gray-400' : 'text-gray-800';
        const bgStyle = isCompleted ? 'bg-gray-50 border-gray-200' : 'bg-white border-amber-100';

        return `
          <div class="${bgStyle} p-4 rounded-xl shadow-sm border flex items-start justify-between gap-3 transition-all">
            <div class="flex items-start gap-3 flex-1">
              <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleComplete('${note.id}', ${!isCompleted})" class="mt-1.5 w-4 h-4 accent-amber-500 cursor-pointer shrink-0">
              <div class="flex-1">
                <p class="${contentStyle} text-base leading-relaxed break-all">${escapeHtml(note.content)}</p>
                <div class="mt-2 flex items-center space-x-2 text-xs text-amber-700/70">
                  <span class="font-semibold text-amber-900">${escapeHtml(note.user_name)}</span>
                  <span>•</span>
                  <span>${new Date(note.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
              </div>
            </div>
            <button onclick="deleteNote('${note.id}')" class="text-gray-300 hover:text-red-500 text-sm p-1 shrink-0">✕</button>
          </div>
        `;
      }).join('');
    }

    async function toggleComplete(id, currentStatus) {
      if (supabaseClient) {
        await supabaseClient.from('notes').update({ is_completed: currentStatus }).eq('id', id);
        fetchNotes();
      }
    }

    function toggleListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声入力に対応していません。');
        return;
      }

      const micBtn = document.getElementById('micBtn');
      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';

      recognition.onstart = () => {
        isListening = true;
        micBtn.className = 'px-4 rounded-xl font-bold bg-red-500 text-white animate-pulse flex items-center justify-center shrink-0';
        micBtn.innerText = '🎙️ 録音中';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.className = 'px-4 rounded-xl font-bold bg-amber-100 text-amber-800 hover:bg-amber-200 transition-all flex items-center justify-center shrink-0';
        micBtn.innerText = '🎤 マイク';
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtn.className = 'px-4 rounded-xl font-bold bg-amber-100 text-amber-800 hover:bg-amber-200 transition-all flex items-center justify-center shrink-0';
        micBtn.innerText = '🎤 マイク';
      };

      recognition.onresult = (e) => {
        const input = document.getElementById('memoInput');
        const text = e.results[0][0].transcript;
        input.value = input.value ? input.value + ' ' + text : text;
      };

      try {
        recognition.start();
      } catch (err) {}
    }

    async function saveNote() {
      const input = document.getElementById('memoInput');
      const nameInput = document.getElementById('userName');
      const content = input.value.trim();
      const userName = nameInput.value.trim() || '家族の誰か';

      if (!content) return;

      localStorage.setItem('family_user_name', userName);

      if (supabaseClient) {
        const { error } = await supabaseClient.from('notes').insert([{ content, user_name: userName, is_completed: false }]);
        if (!error) {
          input.value = '';
          document.getElementById('searchInput').value = '';
          fetchNotes();
        } else {
          alert('保存に失敗しました: ' + error.message);
        }
      }
    }

    async function deleteNote(id) {
      if (supabaseClient) {
        await supabaseClient.from('notes').delete().eq('id', id);
        fetchNotes();
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }
        // Service Worker の登録（PWA化の必須条件）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    }

  </script>
</body>
</html>
